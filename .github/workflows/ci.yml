name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Basic import/compile check
        run: python -m compileall app

      - name: Ensure single Alembic head
        run: |
          python -m alembic heads > /tmp/alembic_heads.txt
          python - <<'PY'
          from pathlib import Path
          text = Path("/tmp/alembic_heads.txt").read_text()
          heads = text.count("(head)")
          if heads != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {heads}")
          print("Alembic head check passed.")
          PY
